apiVersion: 1

# The run log in the ops schema, and table and query stats. monitor is read-only (infra/postgres/init.sql).
datasources:
  - name: Warehouse
    type: grafana-postgresql-datasource
    uid: warehouse
    access: proxy
    url: warehouse:5432
    user: monitor
    jsonData:
      database: $WAREHOUSE_DB
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $MONITOR_PASSWORD
