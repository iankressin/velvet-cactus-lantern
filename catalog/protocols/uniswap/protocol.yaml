chains:
  ethereum:
    contracts:
      v2_factory:
        address: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
        deployed_block: 10000835
        source: >-
          Address from the v2 deployments page. Deploy block from Portal
          portal_evm_get_contract_deployment (create trace in tx
          0xc31d7e7e85cab1d38ce1b8ac17e821ccd47dbde00f9d57f2bd8613bff9428396).
      v3_factory:
        address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
        deployed_block: 12369621
        source: >-
          Address from the v3 Ethereum deployments page. Deploy block from Portal
          portal_evm_get_contract_deployment (create trace in tx
          0x1e20cd6d47d7021ae7e437792823517eeadd835df09dde17ab45afd7a5df4603).
      v4_pool_manager:
        address: "0x000000000004444c5dc75cB358380D2e3dE08A90"
