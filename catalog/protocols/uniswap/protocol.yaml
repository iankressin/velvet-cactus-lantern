          Address from the v4 deployments page. Deploy block from Portal
          portal_evm_get_contract_deployment (create trace in tx
          0x747e0e02b7590eed32cface28e83260884e0b80675f5ae223c6888053aa68528).
events:
  v2.PairCreated:
    emitted_by: v2_factory
    signature: "event PairCreated(address indexed token0, address indexed token1, address pair, uint256)"
    topic0: "0x0d3648bd0f6ba80134a33ba9275ac585d9d315f0ad8355cddefde31afa28d0e9"
    abi: abis/v2-factory.json
  v2.Swap:
    emitted_by: pools created by v2_factory
    signature: "event Swap(address indexed sender, uint256 amount0In, uint256 amount1In, uint256 amount0Out, uint256 amount1Out, address indexed to)"
    topic0: "0xd78ad95fa46c994b6551d0da85fc275fe613ce37657fb8d5e3d130840159d822"
    abi: abis/v2-pair.json
  v3.PoolCreated:
    emitted_by: v3_factory
    signature: "event PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)"
    topic0: "0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118"
    abi: abis/v3-factory.json
  v3.Swap:
    emitted_by: pools created by v3_factory
    signature: "event Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick)"
    topic0: "0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67"
    abi: abis/v3-pool.json
