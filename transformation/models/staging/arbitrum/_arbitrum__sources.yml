version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: arbitrum
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: erc20_transfers
        identifier: arbitrum_erc20_transfers
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: address_code
        identifier: arbitrum_address_code
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: token_bridge
        identifier: arbitrum_token_bridge
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: chainlink_price_feeds
        identifier: arbitrum_chainlink_price_feeds
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: erc20_metadata
        identifier: arbitrum_erc20_metadata
        columns:
          - name: id
            data_tests: [unique, not_null]
