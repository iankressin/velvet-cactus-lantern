version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: coinbase
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: candles
        identifier: coinbase_candles
        columns:
          - name: id
            data_tests: [unique, not_null]
