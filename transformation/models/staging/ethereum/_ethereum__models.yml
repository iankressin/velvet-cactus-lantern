version: 2

models:
  - name: stg_ethereum__eth_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
  - name: stg_ethereum__erc20_balances
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: block_number
        data_tests: [not_null]
      - name: wallet
        data_tests: [not_null]
      - name: token
        data_tests: [not_null]
  - name: stg_ethereum__erc20_metadata
    description: >-
      The name, symbol and decimals of each token in the ethereum erc20 rows of ingestion/wallet-assets.csv
      or evm-erc20-metadata's chains/ethereum/addresses.json, one row per token and block read. A bytes32
      name or symbol is decoded as text, and zero bytes are dropped.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: token
        data_tests: [not_null]
      - name: name
        description: Null when name() reverted or returned nothing at that block.
      - name: symbol
        description: Null when symbol() reverted or returned nothing at that block.
      - name: decimals
        description: Null when decimals() reverted or returned nothing at that block, since ERC-20 makes it optional. Never assume 18.
