version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: ethereum
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: eth_balances
        identifier: ethereum_eth_balances
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: erc20_balances
        identifier: ethereum_erc20_balances
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: erc20_transfers
        identifier: ethereum_erc20_transfers
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: uniswap_v3
        identifier: ethereum_uniswap_v3
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: uniswap_v2
        identifier: ethereum_uniswap_v2
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: uniswap_v4
        identifier: ethereum_uniswap_v4
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: chainlink_price_feeds
        identifier: ethereum_chainlink_price_feeds
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: erc20_metadata
        identifier: ethereum_erc20_metadata
        columns:
          - name: id
            data_tests: [unique, not_null]
