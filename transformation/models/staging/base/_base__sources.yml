version: 2

# Source name + table name must match the ingestion Source's `name` + `table`.
sources:
  - name: base
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    tables:
      - name: erc20_transfers
        identifier: base_erc20_transfers
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: address_code
        identifier: base_address_code
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: op_standard_bridge
        identifier: base_op_standard_bridge
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: chainlink_price_feeds
        identifier: base_chainlink_price_feeds
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: erc20_metadata
        identifier: base_erc20_metadata
        columns:
          - name: id
            data_tests: [unique, not_null]
