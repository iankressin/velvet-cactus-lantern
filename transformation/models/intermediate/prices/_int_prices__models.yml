version: 2

models:
  - name: int_ethereum_chainlink_prices
    description: Chainlink rounds on Ethereum in the shape oracle_prices reads.
    columns:
      - name: id
        data_tests: [unique, not_null]
  - name: int_arbitrum_chainlink_prices
    description: Chainlink rounds on Arbitrum in the shape oracle_prices reads.
    columns:
      - name: id
        data_tests: [unique, not_null]
  - name: int_base_chainlink_prices
    description: Chainlink rounds on Base in the shape oracle_prices reads.
    columns:
      - name: id
        data_tests: [unique, not_null]

  - name: int_binance_token_prices
    description: Binance candles in the shape token_prices reads.
    columns:
      - name: id
        data_tests: [unique, not_null]
  - name: int_coinbase_token_prices
    description: Coinbase candles in the shape token_prices reads.
    columns:
      - name: id
        data_tests: [unique, not_null]

unit_tests:
  - name: a_chainlink_round_is_priced_by_its_feed
    description: >-
      Proof row 1 of catalog/protocols/chainlink/NOTES.md: Ethereum's ETH / USD aggregator, in phase 7,
      reported 220971000000 at 8 decimals in its round 35420, which the proxy reports as round 7 << 64 |
      35420. A made-up 18-decimal feed keeps every digit of its price, down to the last of 18. A round from
      an aggregator that has no seed row drops out.
    model: int_ethereum_chainlink_prices
    given:
      - input: ref('stg_ethereum__chainlink_price_feeds')
        rows:
          - {id: "26356594:572", aggregator: "0x7d4e742018fb52e48b08be73d041c18b21de6fb5", answer: 220971000000, aggregator_round_id: 35420}
          - {id: "2:1", aggregator: "0x00000000000000000000000000000000000000bb", answer: "74919440000000000000123", aggregator_round_id: 1}
          - {id: "1:1", aggregator: "0x00000000000000000000000000000000000000aa", answer: 1, aggregator_round_id: 1}
      - input: ref('chainlink_feeds')
        rows:
          - {chain: ethereum, feed: ETH / USD, proxy: "0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419", phase_id: 7, aggregator: "0x7d4e742018fb52e48b08be73d041c18b21de6fb5", decimals: 8, heartbeat_seconds: 3600}
          - {chain: ethereum, feed: BTC / USD, proxy: "0x00000000000000000000000000000000000000cc", phase_id: 1, aggregator: "0x00000000000000000000000000000000000000bb", decimals: 18, heartbeat_seconds: 3600}
    expect:
      rows:
        - {id: "26356594:572", feed: ETH / USD, token: ETH, quote: USD, proxy: "0x5f4ec3df9cbd43714fe2740f5e3616155c5b8419", round_id: "129127208515966896732", price: 2209.71, answer: 220971000000, decimals: 8}
        - {id: "2:1", feed: BTC / USD, token: BTC, quote: USD, proxy: "0x00000000000000000000000000000000000000cc", round_id: "18446744073709551617", price: "74919.440000000000000123", answer: "74919440000000000000123", decimals: 18}
