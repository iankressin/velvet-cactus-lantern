version: 2

models:
  - name: token_prices
    description: >-
      One candle of one token against one quote asset at one interval, from one exchange: Binance or
      Coinbase. Prices are in quote-asset units, volume in token units and quote_volume in quote-asset
      units.
    columns:
      - name: exchange
        description: The exchange the candle comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [binance, coinbase]
      - name: token
        description: The token's ticker on the exchange, such as UNI.
        data_tests: [not_null]
      - name: quote
        description: The asset the prices are in, such as USDT on Binance or USD on Coinbase.
        data_tests: [not_null]
      - name: interval
        description: The candle's length, as Binance names it, such as 1h or 1d. Coinbase offers 1m, 5m, 15m, 1h, 6h and 1d.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w]
      - name: open_time
        description: When the candle opened.
        data_tests: [not_null]
      - name: close_time
        description: The candle's last millisecond.
        data_tests: [not_null]
      - name: open
        description: The first trade's price, in quote-asset units.
        data_tests: [not_null]
      - name: high
        description: The highest trade price, in quote-asset units.
        data_tests: [not_null]
      - name: low
        description: The lowest trade price, in quote-asset units.
        data_tests: [not_null]
      - name: close
        description: The last trade's price, in quote-asset units.
        data_tests: [not_null]
      - name: volume
        description: How much of the token traded, in token units.
        data_tests: [not_null]
      - name: quote_volume
        description: How much of the quote asset traded, in quote-asset units. Null for Coinbase, which does not send it.
      - name: trades
        description: How many trades the candle holds. Null for Coinbase, which does not send it.
  - name: oracle_prices
    description: >-
      One round of one oracle price feed, from Chainlink on Ethereum, Arbitrum and Base. price is the
      answer scaled by the feed's decimals, in quote units.
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || id"
      - unique:
          arguments:
            column_name: "chain || ':' || proxy || ':' || round_id"
    columns:
      - name: chain
        description: The chain the round landed on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: oracle
        description: The oracle network that reported the round.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [chainlink]
      - name: id
        description: The log's place on its chain, <block>:<logIndex>.
        data_tests: [not_null]
      - name: feed
        description: The feed's name as its proxy describes it, such as ETH / USD.
      - name: token
        description: The asset the feed prices, such as ETH.
      - name: quote
        description: The asset the price is in, such as USD.
      - name: proxy
        description: The address the feed is known by and that users read.
        data_tests: [not_null]
      - name: aggregator
        description: The contract that stored the round and emitted its log. A feed moves to a new one with each phase.
      - name: round_id
        description: The round's id as the proxy reports it, phaseId << 64 | the aggregator's own round id.
        data_tests: [not_null]
      - name: price
        description: The answer scaled by the feed's decimals, in quote units.
        data_tests: [not_null]
      - name: answer
        description: The answer as the aggregator emitted it, an integer in the feed's decimals.
      - name: decimals
        description: How many decimals the feed's answer carries.
      - name: updated_at
        description: When the aggregator stored the round.
        data_tests: [not_null]
      - name: block_number
        description: The block the round's log was in.
      - name: block_timestamp
        description: When that block was produced.
      - name: tx_hash
        description: The transaction the round's log was in.
      - name: log_index
        description: The log's position in that block's logs.
