version: 2

models:
  - name: latest_balances
    description: >-
      Each wallet's latest balance of each asset, on every chain this mart covers: in the asset's base units
      (wei, lamports, satoshis, or token base units) and in whole tokens. token_address is null for the chain's
      native asset. balance_tokens is null when the asset's decimals are unknown.
    config:
      contract:
        enforced: true
    columns:
      - name: blockchain
        data_type: text
        description: Which chain this balance was read from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, solana, bitcoin]
      - name: wallet_address
        data_type: text
        description: The address whose balance was read. Lowercased on Ethereum; as written on Solana and Bitcoin.
        data_tests: [not_null]
      - name: token_address
        data_type: text
        description: >-
          The ERC-20 contract (lowercased) or the SPL mint (as written). Null for the chain's native asset, as in
          an input row with an empty token_address.
        data_tests:
          - not_null:
              config:
                where: "asset_type <> 'native'"
      - name: balance_tokens
        data_type: numeric
        description: >-
          The balance in whole tokens: balance scaled by decimals, exact, with no trailing zeros. Null when tokens
          has no decimals for the token: it is missing from the metadata sources, the contract has no decimals(),
          or the Solana address is not a mint. The warn test latest_balances_tokens_without_decimals counts those
          tokens and lists them in analytics_dbt_test__audit.latest_balances_tokens_without_decimals.
      - name: asset_type
        data_type: text
        description: Whether this is a native, erc20, or spl balance.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [native, erc20, spl]
      - name: decimals
        data_type: integer
        description: >-
          The asset's decimals: 18 for ETH, 9 for SOL, 8 for BTC, and each token's from tokens. Null when tokens
          has no decimals for the token.
      - name: balance
        data_type: numeric
        description: The amount in the asset's base units (wei, lamports, satoshis, or token base units).
        data_tests: [not_null]
      - name: block_number
        data_type: bigint
        description: The block, or Solana slot, this balance was read at.
        data_tests: [not_null]
      - name: read_at
        data_type: timestamptz
        description: When the source loaded this reading, within a minute of when it read it.
        data_tests: [not_null]

  - name: requested_balances
    description: >-
      One row per wallet asset that the newest load of input/wallet-assets.csv asks for, with its latest balance
      from latest_balances: what the balances job writes to its CSV. A pair the input repeats appears once, at
      its first line. Each invalid line appears on its own, with status invalid_input. A pair the newest load
      does not ask for is absent, even when latest_balances holds it.
    config:
      contract:
        enforced: true
    columns:
      - name: blockchain
        data_type: text
        description: The input line's blockchain cell, as written.
        data_tests: [not_null]
      - name: wallet_address
        data_type: text
        description: The input line's wallet_address cell, as written. An Ethereum address keeps its checksum case.
        data_tests: [not_null]
      - name: token_address
        data_type: text
        description: The input line's token_address cell, as written. Null for the chain's native asset.
      - name: balance_tokens
        data_type: numeric
        description: >-
          latest_balances.balance_tokens for the pair: the balance in whole tokens, exact. Null unless status is
          ok.
        data_tests:
          - not_null:
              config:
                where: "status = 'ok'"
      - name: status
        data_type: text
        description: >-
          ok when the pair has a balance in whole tokens; unknown_decimals when it has a reading but its token has
          no decimals; no_reading when no run has read the pair yet; invalid_input when the line names no pair, as
          the source's warning and raw.input_wallet_assets.problem say.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, unknown_decimals, no_reading, invalid_input]
      - name: block_number
        data_type: bigint
        description: latest_balances.block_number, the block or Solana slot of the reading. Null with no reading.
      - name: read_at
        data_type: timestamptz
        description: >-
          latest_balances.read_at, when the reading loaded. Older than this run when this run could not read the
          pair and the CSV shows the last good reading. Null with no reading.
      - name: input_line
        data_type: integer
        description: The line of the input file this row answers. The header is line 1.
        data_tests: [unique, not_null]

unit_tests:
  - name: latest_balances_scales_each_latest_balance_by_its_decimals
    description: >-
      Every digit of a large balance survives the scaling, natives have no token_address, a token with no
      decimals keeps its row, the latest block, then the latest load, wins, and read_at is the winner's load time.
    model: latest_balances
    given:
      - input: ref('int_ethereum_balances')
        format: sql
        rows: |
          select 'e1' as id, 'ethereum' as chain, '0xw1' as wallet, 'native' as asset_type, 'eth' as asset, 18 as decimals, 100::bigint as block_number, 1234567890123456789012345678::numeric as balance, '2026-11-07 00:00+00'::timestamptz as _loaded_at
          union all select 'e2', 'ethereum', '0xw1', 'erc20', '0xusdc', null, 100, 1500000, '2026-11-07 00:00+00'
          union all select 'e3', 'ethereum', '0xw1', 'erc20', '0xnometa', null, 100, 42, '2026-11-07 00:00+00'
          union all select 'e4', 'ethereum', '0xw2', 'native', 'eth', 18, 100, 5, '2026-11-07 00:00+00'
          union all select 'e5', 'ethereum', '0xw2', 'native', 'eth', 18, 101, 1, '2026-11-07 00:00+00'
          union all select 'e6', 'ethereum', '0xw2', 'native', 'eth', 18, 101, 2000000000000000000, '2026-11-07 01:00+00'
          union all select 'e7', 'ethereum', '0xw3', 'erc20', '0xzero', null, 100, 7, '2026-11-07 00:00+00'
      - input: ref('int_solana_balances')
        format: sql
        rows: |
          select 's1' as id, 'solana' as chain, 'SoLWaLLet1' as wallet, 'native' as asset_type, 'sol' as asset, 9 as decimals, 300::bigint as block_number, 0::numeric as balance, '2026-11-07 00:00+00'::timestamptz as _loaded_at
          union all select 's2', 'solana', 'SoLWaLLet1', 'spl', 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', null, 300, 2500000, '2026-11-07 00:00+00'
      - input: ref('int_bitcoin_balances')
        format: sql
        rows: |
          select 'b1' as id, 'bitcoin' as chain, 'bc1qexample' as wallet, 'native' as asset_type, 'btc' as asset, 8 as decimals, 900::bigint as block_number, 150000000::numeric as balance, '2026-11-07 00:00+00'::timestamptz as _loaded_at
      - input: ref('tokens')
        format: sql
        rows: |
          select 'ethereum' as chain, '0xusdc' as token, 'USD Coin' as name, 'USDC' as symbol, 6 as decimals, 100::bigint as block_number
          union all select 'ethereum', '0xzero', 'Zero', 'ZERO', 0, 100
          union all select 'solana', 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', 'USD Coin', 'USDC', 6, 300
    expect:
      format: sql
      rows: |
        select 'ethereum' as blockchain, '0xw1' as wallet_address, null::text as token_address, 1234567890.123456789012345678::numeric as balance_tokens, 'native' as asset_type, 18 as decimals, 1234567890123456789012345678::numeric as balance, 100::bigint as block_number, '2026-11-07 00:00+00'::timestamptz as read_at
        union all select 'ethereum', '0xw1', '0xusdc', 1.5, 'erc20', 6, 1500000, 100, '2026-11-07 00:00+00'
        union all select 'ethereum', '0xw1', '0xnometa', null, 'erc20', null, 42, 100, '2026-11-07 00:00+00'
        union all select 'ethereum', '0xw2', null, 2, 'native', 18, 2000000000000000000, 101, '2026-11-07 01:00+00'
        union all select 'ethereum', '0xw3', '0xzero', 7, 'erc20', 0, 7, 100, '2026-11-07 00:00+00'
        union all select 'solana', 'SoLWaLLet1', null, 0, 'native', 9, 0, 300, '2026-11-07 00:00+00'
        union all select 'solana', 'SoLWaLLet1', 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', 2.5, 'spl', 6, 2500000, 300, '2026-11-07 00:00+00'
        union all select 'bitcoin', 'bc1qexample', null, 1.5, 'native', 8, 150000000, 900, '2026-11-07 00:00+00'

  - name: requested_balances_gives_each_requested_pair_one_row
    description: >-
      Only the newest load counts; a checksum-case address finds its lowercased reading and keeps its case;
      a repeated pair keeps its first line; a native request never takes a token's reading; a pair with no
      reading this run keeps its last good one; each invalid line keeps its own row.
    model: requested_balances
    given:
      - input: ref('stg_input__wallet_assets')
        format: sql
        rows: |
          select 'L1:2' as id, 'L1' as load_id, 2 as line, 'ethereum' as blockchain, '0xOLD' as wallet_address, '' as token_address, 'native' as asset_type, '0xold' as wallet, null::text as token, null::text as problem, '2026-11-06 06:00+00'::timestamptz as _loaded_at
          union all select 'L2:2', 'L2', 2, 'ethereum', '0xAbC', '', 'native', '0xabc', null, null, '2026-11-07 06:00+00'
          union all select 'L2:3', 'L2', 3, 'ethereum', '0xAbC', '0xUSDC', 'erc20', '0xabc', '0xusdc', null, '2026-11-07 06:00+00'
          union all select 'L2:4', 'L2', 4, 'ethereum', '0xabc', '0xnometa', 'erc20', '0xabc', '0xnometa', null, '2026-11-07 06:00+00'
          union all select 'L2:5', 'L2', 5, 'ethereum', '0xabc', '0xreverted', 'erc20', '0xabc', '0xreverted', null, '2026-11-07 06:00+00'
          union all select 'L2:6', 'L2', 6, 'solana', 'SoLWaLLet1', '', 'native', 'SoLWaLLet1', null, null, '2026-11-07 06:00+00'
          union all select 'L2:7', 'L2', 7, 'bitcoin', 'BC1QEXAMPLE', '', 'native', 'bc1qexample', null, null, '2026-11-07 06:00+00'
          union all select 'L2:8', 'L2', 8, 'ethereum', '0x123', '', null, null, null, 'wallet_address "0x123" is not an Ethereum address', '2026-11-07 06:00+00'
          union all select 'L2:9', 'L2', 9, 'ethereum', '0x123', '', null, null, null, 'wallet_address "0x123" is not an Ethereum address', '2026-11-07 06:00+00'
          union all select 'L2:10', 'L2', 10, 'ethereum', '0xABC', '', 'native', '0xabc', null, null, '2026-11-07 06:00+00'
      - input: ref('latest_balances')
        format: sql
        rows: |
          select 'ethereum' as blockchain, '0xabc' as wallet_address, null::text as token_address, 2::numeric as balance_tokens, 'native' as asset_type, 18 as decimals, 2000000000000000000::numeric as balance, 101::bigint as block_number, '2026-11-07 06:01+00'::timestamptz as read_at
          union all select 'ethereum', '0xabc', '0xusdc', 1.5, 'erc20', 6, 1500000, 101, '2026-11-07 06:01+00'
          union all select 'ethereum', '0xabc', '0xnometa', null, 'erc20', null, 42, 101, '2026-11-07 06:01+00'
          union all select 'ethereum', '0xold', null, 1, 'native', 18, 1000000000000000000, 90, '2026-11-06 06:01+00'
          union all select 'solana', 'SoLWaLLet1', 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', 2.5, 'spl', 6, 2500000, 300, '2026-11-07 06:01+00'
          union all select 'bitcoin', 'bc1qexample', null, 1.5, 'native', 8, 150000000, 900, '2026-11-05 06:01+00'
    expect:
      format: sql
      rows: |
        select 'ethereum' as blockchain, '0xAbC' as wallet_address, null::text as token_address, 2::numeric as balance_tokens, 'ok' as status, 101::bigint as block_number, '2026-11-07 06:01+00'::timestamptz as read_at, 2 as input_line
        union all select 'ethereum', '0xAbC', '0xUSDC', 1.5, 'ok', 101, '2026-11-07 06:01+00', 3
        union all select 'ethereum', '0xabc', '0xnometa', null, 'unknown_decimals', 101, '2026-11-07 06:01+00', 4
        union all select 'ethereum', '0xabc', '0xreverted', null, 'no_reading', null, null, 5
        union all select 'solana', 'SoLWaLLet1', null, null, 'no_reading', null, null, 6
        union all select 'bitcoin', 'BC1QEXAMPLE', null, 1.5, 'ok', 900, '2026-11-05 06:01+00', 7
        union all select 'ethereum', '0x123', null, null, 'invalid_input', null, null, 8
        union all select 'ethereum', '0x123', null, null, 'invalid_input', null, null, 9
