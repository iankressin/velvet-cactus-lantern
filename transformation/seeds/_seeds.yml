version: 2

seeds:
  - name: arbitrum_token_gateways
    description: >-
      The rows are the default gateway and the gateways that the L2GatewayRouter, 0x5288c571fd7ad117bea99bf60fe0846c4e84f933, returned from getGateway for UNI,
      USDC, WETH, DAI, LPT, GRT, wstETH, ARB and USDS on Ethereum, read at Arbitrum block 521602006 on
      2026-11-05. A token whose gateway is not here needs a row, or its moves leave no trace in the marts;
      the warn test on stg_arbitrum__token_bridge.contract lists such logs.
    config:
      column_types:
        address: text
        name: text
    columns:
      - name: address
        data_tests: [unique, not_null]
  - name: chainlink_feeds
    description: >-
      One row per Chainlink aggregator an evm-chainlink-price-feeds source loads, with the feed it serves.
      feed, decimals and phase_id come from each proxy's description(), decimals() and
      phaseId()/phaseAggregators(), read on 2026-11-06; heartbeat_seconds from Chainlink's feed directory
      (feed_directory in catalog/protocols/chainlink/protocol.yaml). Each aggregator in a chain's
      addresses.json in that source needs a row here, or its rounds leave no trace in the marts; the warn
      test on each stg_<chain>__chainlink_price_feeds.aggregator lists such logs.
    config:
      column_types:
        chain: text
        feed: text
        proxy: text
        phase_id: integer
        aggregator: text
        decimals: integer
        heartbeat_seconds: integer
    data_tests:
      - unique:
          arguments:
            column_name: "chain || ':' || aggregator"
    columns:
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, arbitrum, base]
      - name: feed
        data_tests: [not_null]
      - name: proxy
        data_tests: [not_null]
      - name: phase_id
        data_tests: [not_null]
      - name: aggregator
        data_tests: [not_null]
      - name: decimals
        data_tests: [not_null]
      - name: heartbeat_seconds
        data_tests: [not_null]
