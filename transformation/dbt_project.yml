name: transformation
version: "1.0.0"
profile: transformation

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

models:
  transformation:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
      # Views, not ephemeral, so each chain's rows show up as their own step in Dagster.
      balances:
        +materialized: view
      # Views, so each chain's metadata readings show up as their own step in Dagster.
      tokens:
        +materialized: view
    marts:
      +materialized: table
